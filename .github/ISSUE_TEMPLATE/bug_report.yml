name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste real traces, prompts, keys or personal data. A small synthetic example is enough.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you expect, what did you see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The command or the clicks, and a synthetic input if one is needed.
    validations:
      required: true
  - type: input
    id: emitter
    attributes:
      label: Trace emitter and version
      description: Only for an import problem, for example the instrumentation package that wrote the trace.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, and the browser if the problem is on a screen.
    validations:
      required: true
