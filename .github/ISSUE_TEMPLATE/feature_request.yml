name: Feature request
description: Suggest something DropScope should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: How could it work? A sketch or an example is welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you tried or considered.
